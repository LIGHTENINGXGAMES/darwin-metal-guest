name: Build guest

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - name: Build
        run: sh scripts/build.sh build
      - uses: actions/upload-artifact@v4
        with:
          name: darwin-metal-guest
          path: build/
          retention-days: 7
